name: Deploy to GitHub Pages
# 2026-11-03 저장소 비공개 전환: 푸시할 때마다 배포하던 것과 Pages 자동 켜기를 끔(수동 실행 전용).
# 다시 공개하려면 배포가이드.md의 '비공개 전환' 항목을 먼저 읽을 것.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
