<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="72시간">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>72시간 생존게임</title>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  /* Layout: 한 화면 모바일 게임 셸 — 상단 상황 HUD · 가운데 SVG 장면 · 하단 결정 시트. 화면은 제자리에서 교체된다.
     밤·정전·지하 대피소가 무대라 의도적으로 다크 단일 테마. 외부 리소스 0(오프라인 자립). */
  --night:#0b0f13; --panel:#141a20; --panel2:#1c242c; --line:#29333d; --line2:#36424e;
  --fg:#e8edf1; --body:#cdd6dd; --mut:#8e9ba7; --faint:#5e6a76;
  --amber:#ffb224; --amber-ink:#1a1100; --amber-dim:#7a5a1e; --amber-bg:#2a2010;
  --cd-orange:#f08a24; --cd-blue:#2e6bd6;            /* 국제 민방위 표지: 주황 바탕 + 파란 삼각형 */
  --exit:#2ccf7c; --exit-ink:#03170b; --exit-bg:#0f2a1d; /* 비상구 녹색 */
  --alert:#ff5449; --alert-bg:#361613;
  --info:#5aa8ff; --info-bg:#122437;
  --wall:#4a5663; --floor:#151c23; --floor2:#192129; --concrete:#20272e; --concrete2:#262e36;
  --skin:#c9d3dc;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,"Roboto Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--night)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(18px + env(safe-area-inset-bottom,0px))}
#app.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}

/* ---------- 공통 버튼 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;
  border-radius:13px;border:1px solid var(--line2);background:var(--panel2);font-weight:750;font-size:16px;cursor:pointer;text-align:center;letter-spacing:-.01em}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.go{background:var(--exit);color:var(--exit-ink);border-color:var(--exit)}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;font-size:14px;padding:8px 12px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.row{display:flex;gap:8px}
.row>*{flex:1 1 0;min-width:0}
.stack{display:grid;gap:8px}
.eyebrow{font:800 12px var(--sans);letter-spacing:.04em;color:var(--amber)}
.mut{color:var(--mut)} .faint{color:var(--faint)}
.small{font-size:12.5px}

/* ---------- 타이틀 ---------- */
.title-art{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.title-art svg{display:block;width:100%;height:auto}
.title-block{display:grid;gap:6px;margin-top:-6px}
.logo-row{display:flex;align-items:center;gap:12px}
.cd-mark{width:42px;height:42px;flex:none}
.title-block h1{margin:0;font-size:clamp(52px,17vw,76px);line-height:.95;font-weight:900;letter-spacing:-.05em}
.title-block h1 span{color:var(--amber)}
.tagline{font-size:17px;font-weight:700;color:var(--body);text-wrap:balance;margin:0}
.title-note{font-size:12.5px;color:var(--faint);line-height:1.6;margin:0}
.sweep{transform-origin:50% 100%;animation:sweep 7s ease-in-out infinite alternate}
.sweep.b{animation-duration:9s;animation-delay:-3s}
@keyframes sweep{from{transform:rotate(-28deg)}to{transform:rotate(26deg)}}
.win-flick{animation:flick 4s steps(1) infinite}
@keyframes flick{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.25}52%{opacity:1}}

/* ---------- 설정 ---------- */
.seg{display:grid;gap:6px}
.seg-label{font-size:12.5px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.seg-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.seg-opts button{min-height:56px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;
  padding:8px 6px;display:grid;gap:2px;align-content:center;text-align:center}
.seg-opts button b{font-size:14.5px}
.seg-opts button span{font-size:11.5px;color:var(--mut);line-height:1.3}
.seg-opts button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-bg);box-shadow:inset 0 0 0 1px var(--amber)}
.seg-opts button[aria-pressed="true"] b{color:var(--amber)}
.seg-opts button:disabled{opacity:.4}
.sync-note{font-size:12.5px;border-radius:10px;padding:9px 11px;background:var(--panel);border:1px dashed var(--line2);color:var(--mut)}
.sync-note b{color:var(--fg)}

/* ---------- 상단 HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--night);display:flex;align-items:center;gap:8px;
  padding-block:10px 9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hud{flex-wrap:nowrap}
.hclk{display:grid;line-height:1.15;min-width:0}
.hud .clock{font:800 19px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hud .sub{font-size:11.5px;color:var(--mut);white-space:nowrap}
.hud .chip{min-width:0;overflow:hidden;text-overflow:ellipsis}
.hud .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;
  border:1px solid var(--line2);color:var(--mut);white-space:nowrap;background:var(--panel)}
.chip .ic{width:14px;height:14px}
.chip.red{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 45%,transparent);background:var(--alert-bg)}
.chip.amb{color:var(--amber);border-color:var(--amber-dim);background:var(--amber-bg)}
.chip.grn{color:var(--exit);border-color:color-mix(in srgb,var(--exit) 40%,transparent);background:var(--exit-bg)}
.iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}

/* ---------- 장면 ---------- */
.scene{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#090c10}
.scene svg{display:block;width:100%;height:auto}
.scene .tag{position:absolute;left:10px;top:10px;font:700 11px var(--mono);letter-spacing:.1em;color:var(--fg);
  background:rgba(8,11,14,.72);border:1px solid var(--line2);border-radius:7px;padding:3px 8px}
.flick{animation:fl 3.2s infinite}
@keyframes fl{0%,100%{opacity:.95}91%{opacity:.95}92%{opacity:.3}94%{opacity:.9}95%{opacity:.4}96%{opacity:.95}}
.exit-glow{animation:eg 2.4s ease-in-out infinite}
@keyframes eg{0%,100%{opacity:.85}50%{opacity:1}}
.red-pulse{animation:rp 1.6s ease-in-out infinite}
.amb-pulse{animation:ap 1.6s ease-in-out infinite}
@keyframes ap{0%,100%{opacity:.04}50%{opacity:.16}}
@keyframes rp{0%,100%{opacity:.12}50%{opacity:.5}}
.breath{animation:br 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}

/* ---------- 가족 · 자원 ---------- */
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.fam[data-n="4"]{grid-template-columns:1fr 1fr}
.mem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:5px;min-width:0}
.mem .top{display:flex;align-items:center;gap:6px;justify-content:space-between}
.mem b{font-size:13.5px}
.mem .hp{font:700 12px var(--mono);font-variant-numeric:tabular-nums;color:var(--mut)}
.bar{height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s ease}
.conds{display:flex;gap:4px;flex-wrap:wrap;min-height:18px}
.cond{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--alert-bg);color:var(--alert)}
.cond.ok{background:var(--exit-bg);color:var(--exit)}
.cond .ic{width:11px;height:11px}
.mem.crit{border-color:color-mix(in srgb,var(--alert) 55%,transparent)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.r{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 9px;display:flex;align-items:center;gap:7px;min-width:0}
.r .ic{width:18px;height:18px;color:var(--mut)}
.r div{min-width:0}
.r b{display:block;font:800 15px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.r span{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r.low{border-color:color-mix(in srgb,var(--alert) 50%,transparent)}
.r.low b{color:var(--alert)}
.r.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.06)}}

/* ---------- 결정 시트 ---------- */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;display:grid;gap:11px}
.sheet h2{margin:0;font-size:19px;line-height:1.32;letter-spacing:-.015em;text-wrap:balance}
.sheet p{margin:0;color:var(--body)}
.sheet .lead{display:flex;gap:12px;align-items:flex-start}
.badge{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel2);color:var(--amber)}
.badge .ic{width:28px;height:28px}
.badge.red{color:var(--alert);background:var(--alert-bg);border-color:color-mix(in srgb,var(--alert) 40%,transparent)}
.badge.blue{color:var(--info);background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.badge.green{color:var(--exit);background:var(--exit-bg);border-color:color-mix(in srgb,var(--exit) 35%,transparent)}
.choices{display:grid;gap:7px}
.choice{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 13px;border-radius:12px;
  border:1px solid var(--line2);background:var(--panel2);cursor:pointer;min-height:54px}
.choice:active{background:#232d37}
.choice .k{flex:none;width:25px;height:25px;border-radius:7px;background:var(--night);border:1px solid var(--line2);
  font:800 12.5px var(--mono);display:grid;place-items:center;color:var(--amber);margin-top:1px}
.choice .ct{min-width:0}
.choice b{display:block;font-size:15.5px;line-height:1.38;font-weight:700}
.choice small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.4}
.choice:disabled{opacity:.42;cursor:not-allowed}
.choice.right{border-color:var(--exit);background:var(--exit-bg)}
.choice.wrong{border-color:var(--alert);background:var(--alert-bg)}
.hint{border-left:3px solid var(--info);background:var(--info-bg);padding:8px 11px;border-radius:0 10px 10px 0;font-size:13.5px;color:var(--fg)}
.hint .eyebrow{color:var(--info);display:block;margin-bottom:2px}
.result{font-size:15px;color:var(--fg);line-height:1.55}
.lesson{border-radius:12px;padding:10px 12px;font-size:13.5px;display:grid;gap:4px;border:1px solid var(--line2);background:var(--panel2)}
.lesson.ok{border-color:color-mix(in srgb,var(--exit) 45%,transparent);background:var(--exit-bg)}
.lesson.no{border-color:color-mix(in srgb,var(--alert) 45%,transparent);background:var(--alert-bg)}
.lesson .eyebrow{color:inherit}
.lesson.ok .eyebrow{color:var(--exit)} .lesson.no .eyebrow{color:var(--alert)}
.lesson .src{font-size:11.5px;color:var(--mut)}
.fx-list{display:flex;flex-wrap:wrap;gap:5px}
.fx{font:700 11.5px var(--mono);padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line2);color:var(--mut)}
.fx.up{color:var(--exit)} .fx.down{color:var(--alert)}
.timebar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.timebar i{display:block;height:100%;width:100%;background:var(--alert);transform-origin:left center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.act{display:grid;gap:4px;align-content:start;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;min-height:84px}
.act .ic{width:22px;height:22px;color:var(--amber)}
.act b{font-size:14.5px;line-height:1.25}
.act small{font-size:11.5px;color:var(--mut);line-height:1.35}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.warn .ic{color:var(--alert)}

/* ---------- 휴대폰 재난문자 ---------- */
.phone{margin:6px auto 0;width:min(100%,330px);border-radius:34px;border:2px solid #2c3640;background:linear-gradient(#0f1823,#06090d);
  padding:44px 14px 22px;position:relative;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.phone::before{content:"";position:absolute;top:12px;left:50%;width:84px;height:22px;margin-left:-42px;border-radius:99px;background:#000}
.ph-time{text-align:center;font:300 58px var(--sans);letter-spacing:-.03em;line-height:1;color:#eef3f7;font-variant-numeric:tabular-nums}
.ph-date{text-align:center;font-size:14px;color:#aeb9c4;margin:6px 0 16px}
.cbs{border-radius:18px;background:rgba(40,46,54,.92);padding:11px 13px;display:grid;gap:4px;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.cbs .h{display:flex;align-items:center;gap:7px;font-size:12px;color:#c9d2da}
.cbs .h b{color:#ff6a5e;font-weight:800}
.cbs .h .ic{width:15px;height:15px;color:#ff6a5e}
.cbs p{margin:0;font-size:13.5px;line-height:1.5;color:#eef3f7}
@keyframes pop{from{transform:translateY(-14px) scale(.96);opacity:0}}

/* ---------- 60초 탈출 ---------- */
.grab-top{display:flex;align-items:center;gap:12px;padding-top:10px}
.ring{position:relative;width:74px;height:74px;flex:none}
.ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;font:800 25px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.ring.danger .val{color:var(--alert)}
.grab-msg{min-width:0;display:grid;gap:2px}
.grab-msg b{font-size:16px;line-height:1.3}
.grab-msg span{font-size:12.5px;color:var(--mut)}
.plan{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0d1217;touch-action:manipulation}
.plan svg{display:block;width:100%;height:auto}
.plan .room{cursor:pointer}
.plan .room rect.fl{fill:var(--floor);transition:fill .2s}
.plan .room.here rect.fl{fill:#24303b}
.plan .room text{font:700 11px var(--sans);fill:#9fb0bf;letter-spacing:.02em;pointer-events:none}
.plan .room.here text{fill:var(--amber)}
.plan .furn{fill:none;stroke:#34414d;stroke-width:1.4;pointer-events:none}
.plan .wall{fill:none;stroke:var(--wall);stroke-width:5;stroke-linecap:square;pointer-events:none}
.plan .itm{pointer-events:none;transition:opacity .25s}
.plan .itm circle{fill:#26313b;stroke:#4b5a68;stroke-width:1}
.plan .itm.act circle{fill:#2a2412;stroke:var(--amber-dim)}
.plan .itm use{color:#dfe7ee}
.plan .itm.gone{opacity:0}
.plan .tok{transition:transform .6s cubic-bezier(.4,.1,.3,1)}
.plan .winred{fill:var(--alert)}
.tray{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tray-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--mut)}
.tray-h b{color:var(--fg);font-size:15px}
.it{position:relative;overflow:hidden;display:flex;gap:9px;align-items:center;text-align:left;padding:9px 10px;border-radius:11px;
  border:1px solid var(--line2);background:var(--panel2);cursor:pointer;min-height:56px}
.it .ic{width:26px;height:26px;color:#dfe7ee}
.it div{min-width:0;position:relative;z-index:1}
.it b{display:block;font-size:13.5px;line-height:1.25}
.it small{display:block;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;line-height:1.35}
.it.act{border-color:var(--amber-dim)}
.it.act .ic{color:var(--amber)}
.it.fam .ic{color:var(--exit)}
.it:disabled{opacity:.38;cursor:not-allowed}
.it .prog{position:absolute;inset:0;background:color-mix(in srgb,var(--amber) 22%,transparent);transform-origin:left;transform:scaleX(0)}
.it.done{opacity:.35}
.bag{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.slot{aspect-ratio:1;max-width:100%;border-radius:7px;border:1px dashed var(--line2);display:grid;place-items:center;background:var(--panel)}
.slot.f{border-style:solid;border-color:var(--amber-dim);background:var(--amber-bg)}
.slot .ic{width:70%;height:70%;color:var(--amber)}
.bag-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);align-items:center}
.bag-h b{color:var(--fg)}
.pack-line{font-size:12.5px;color:var(--exit);display:flex;gap:6px;align-items:center}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(6,8,11,.86);display:grid;place-items:center;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.overlay .sheet{max-width:440px;width:100%}

/* ---------- 미니게임 ---------- */
.mini{display:grid;gap:12px;justify-items:center;text-align:center}
.pad{width:min(64vw,230px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line2);background:radial-gradient(circle at 50% 40%,#2a333c,#151b21);
  display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;position:relative}
.pad svg{width:46%;height:46%}
.pad.hit{transform:scale(.95);background:radial-gradient(circle at 50% 40%,#3a3220,#1b1610)}
.pad .halo{position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--amber);opacity:0}
.pad .halo.on{animation:halo .5s ease-out}
@keyframes halo{from{opacity:.9;transform:scale(.86)}to{opacity:0;transform:scale(1.08)}}
.meter{width:100%;max-width:320px;display:grid;gap:4px}
.meter .bar{height:10px}
.bpm{font:800 34px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bpm small{font-size:13px;color:var(--mut);font-weight:600}

function newGame(o){
  const seed=(o.seed>>>0)||(((Date.now()&0xffffffff)^Math.floor(Math.random()*1e9))>>>0);
  RNG.seed(seed);
  const scen=o.scen==='rand'?pick(['conv','conv','nuke','chem']):o.scen;
  const d=DIFF[o.diff], now=new Date();
  const fam=[{id:'me',n:'당신',k:'me',hp:100,c:[]}];
  let home={floor:12,sh:PRESET_SH.map(x=>Object.assign({},x)),meet:''};
  const my=o.fam==='my'?getMy():null;
  if(my){
    if(my.sp.on)fam.push({id:'sp',n:(my.sp.n||'배우자').slice(0,8),k:'adult',hp:100,c:[]});
    my.kids.slice(0,2).forEach((x,i)=>fam.push({id:i?'kid2':'kid',n:(x.n||(my.kids.length>1?(i?'둘째':'첫째'):'아이')).slice(0,8),k:'kid',hp:100,c:[]}));
    if(my.eld.on)fam.push({id:'eld',n:(my.eld.n||'어르신').slice(0,8),k:'eld',hp:100,c:[]});
    const sh=(my.sh||[]).filter(x=>x&&x.n).map(x=>({n:String(x.n).slice(0,40),k:SHK[x.k]?x.k:'ground',m:clamp(+x.m||1,1,60)}));
    home={floor:clamp(Math.round(+my.floor||12),1,60),sh:sh.length?sh:home.sh,meet:(my.meet||'').slice(0,40)};
  }else{
    if(o.fam>=2)fam.push({id:'sp',n:'배우자',k:'adult',hp:100,c:[]});
    if(o.fam>=3)fam.push({id:'kid',n:'아이',k:'kid',hp:100,c:[]});
  }
  G={v:2,seed,home,hide:!!d.hide,delayed:[],locName:null,opts:o,diff:o.diff,mul:d.mul,scen,scenKnown:o.scen!=='rand',
    season:o.season||seasonOf(now.getMonth()+1),date:{m:now.getMonth()+1,d:now.getDate(),w:DOW[now.getDay()]},
    fam,res:{water:0,food:0,power:d.phone,meds:0},inv:{},morale:62,pol:0,trust:0,hintCharges:0,infoTurns:0,
    phase:'alert',step:null,turn:0,ration:'base',loc:'park',flags:{},log:[],fired:{},newBadges:[],cur:null,
    kit:null,kitCount:0,grab:null,moveQ:[],rt:null,over:false,rngS:0};
  /* 현관 생존배낭 */
  let kit=null;
  if(o.bag==='sync'){kit=readHandbookKit()}
  else if(o.bag==='full'){kit=KIT_NAMES.map(()=>true)}
  if(kit&&kit.some(Boolean)){G.kit=kit;G.kitCount=kit.filter(Boolean).length}
  return G;
}

const M=id=>G.fam.find(m=>m.id===id);
const hasKid=()=>!!M('kid');
const kidM=()=>M('kid');
const kidN=p=>p?josa(M('kid').n,p):M('kid').n;
const spN=p=>M('sp')?(p?josa(M('sp').n,p):M('sp').n):'';

/* 추위·더위·탈수에 약한 사람: 아이 → 어르신 → 무작위 */
function vulnerable(){return M('kid')||M('eld')||victim()}
function nm(m){return m.n}
function list(t){if(t==='all')return G.fam;if(typeof t==='string')return [M(t)].filter(Boolean);return Array.isArray(t)?t:[t]}
function victim(pref){
  const others=G.fam.filter(m=>m.id!=='me');
  if(pref==='kid'&&M('kid'))return M('kid');
  if(pref==='other')return others.length?pick(others):M('me');
  if(pref==='adult'){const a=G.fam.filter(m=>m.k!=='kid');return pick(a)}
  return pick(G.fam);
}
function push(label,n,unit){FX.push({l:label,n,u:unit||''})}
function hurt(t,n){list(t).forEach(m=>{const k=(m.k==='kid'||m.k==='eld'?1.15:1)*G.mul;const v=Math.max(1,Math.round(n*k));m.hp=clamp(m.hp-v,0,100);push(m.n,-v)})}
function heal(t,n){list(t).forEach(m=>{if(m.crit)return;const b=m.hp;m.hp=clamp(m.hp+n,0,100);if(m.hp>b)push(m.n,m.hp-b)})}
function addC(m,c){if(m&&!m.c.includes(c)){m.c.push(c);push(m.n+' '+CONDS[c].n,null)}}
function clrC(m,c){if(m)m.c=m.c.filter(x=>x!==c)}
function res(k,n){const b=G.res[k];G.res[k]=Math.max(0,Math.round((b+n)*100)/100);const d=G.res[k]-b;if(d)push({water:'물',food:'식량',power:'전력',meds:'의약품'}[k],k==='water'?Math.round(d*10)/10:d,{water:'L',power:'%',food:'',meds:''}[k])}
function mor(n){const b=G.morale;G.morale=clamp(G.morale+n,0,100);if(G.morale!==b)push('사기',G.morale-b)}
function pol(n){const b=G.pol;G.pol=clamp(G.pol+Math.round(n>0?n*G.mul:n),0,100);if(G.pol!==b)push(G.scen==='chem'?'오염':'피폭',G.pol-b)}
function trust(n){G.trust+=n;push('이웃 신뢰',n)}
const has=k=>(G.inv[k]||0)>0;
function give(k,n){G.inv[k]=(G.inv[k]||0)+(n||1)}
function warmth(){return has('blanket')||has('quilt')}
function lightSrc(){return has('torch')?'torch':(G.res.power>=5&&!G.flags.emp)?'phone':null}
function clockAt(turn){/* T0 = 23:15 */const mins=(23*60+15+turn*360)%1440;return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0')}
function dayOf(turn){return Math.floor((turn+0)/4)+1}

function applyGrab(gr){
  G.grab={left:Math.round(gr.left),picked:gr.picked.slice(),late:gr.late,famOk:gr.famOk,gas:gr.gas,breaker:gr.breaker,pack:gr.pack,slotsUsed:gr.used};
  G.flags.gas=gr.gas;G.flags.breaker=gr.breaker;
  const E={water6:()=>G.res.water+=12,water1:()=>G.res.water+=2,foodbox:()=>G.res.food+=6,ramen:()=>give('ramen',5),burner:()=>give('burner'),
    radio:()=>give('radio'),pbank:()=>G.res.power+=60,wallet:()=>give('wallet'),laptop:()=>give('laptop'),charger:()=>give('charger'),
    cash:()=>give('cash'),gold:()=>give('gold'),quilt:()=>give('quilt'),meds:()=>G.res.meds+=2,teddy:()=>give('teddy'),
    firstaid:()=>{G.res.meds+=3;give('firstaid')},wipes:()=>give('wipes'),bleach:()=>give('bleach'),torch:()=>give('torch'),
    candle:()=>give('candle'),tools:()=>give('tools'),vinyl:()=>give('vinyl'),mask:()=>give('mask',10)};
  gr.picked.forEach(id=>{if(E[id])E[id]()});
  if(gr.pack&&G.kit){G.kit.forEach((on,i)=>{if(!on)return;const g=KIT_GIVE[i];
    if(g.water)G.res.water+=g.water;if(g.food)G.res.food+=g.food;if(g.power)G.res.power+=g.power;if(g.meds)G.res.meds+=g.meds;
    if(g.morale)G.morale+=g.morale;if(g.hintCharges)G.hintCharges+=g.hintCharges;if(g.inv)Object.keys(g.inv).forEach(k=>give(k,g.inv[k]))})}
  G.homeLeft=Object.keys(ITEMS).filter(k=>!ITEMS[k].act&&!ITEMS[k].fam&&k!=='pack'&&!gr.picked.includes(k));
  if(gr.late>0){mor(-6)}
  if(gr.left>=15&&gr.famOk)badge('swift');
  if(gr.gas&&gr.breaker)badge('nogas');
  if(gr.pack&&G.kitCount>=12)badge('bag12');
  G.morale=clamp(G.morale,0,100);
}
/* 화생방: 고층 우리 집에 도착하면 두고 온 물자를 쓸 수 있다 */
function arriveHome(){
  G.loc='high';G.flags.tap=1;let w=0,f=0;
  if(HF()<5){G.homeLeft=[];return ' 우리 집은 저층이라, 위층 이웃집 문을 두드려 함께 머물기로 했다.'}
  (G.homeLeft||[]).forEach(k=>{if(k==='water6')w+=12;if(k==='water1')w+=2;if(k==='foodbox')f+=6;
    if(['quilt','torch','vinyl','candle','radio','bleach','wipes','teddy','burner','wallet'].includes(k))give(k);
    if(k==='mask')give('mask',10);if(k==='meds')G.res.meds+=2;if(k==='firstaid'){G.res.meds+=3;give('firstaid')}});
  G.homeLeft=[];
  if(w)res('water',w);if(f)res('food',f);
  return (w||f)?` 집에 두고 온 물 ${w}L·식량 ${f}일분을 다시 확보했다.`:'';
}

/* ---------- 이벤트 선택 ---------- */
const SCHED={
  conv:{0:'settle',1:'contact',2:'rumor',4:'blackout',6:'gohome',8:'second',10:'relief'},
  nuke:{0:'decon',1:'emp',2:'ki',3:'outside',5:'reunite',8:'evac'},
  chem:{0:'settle',1:'chemalert',2:'seal',3:'skin',5:'chemwater',9:'relief'}
};
function evOK(e){return(!e.scen||e.scen.includes(G.scen))&&(!e.loc||e.loc.includes(G.loc))&&(!e.cond||e.cond())}
function pickEvent(){
  const sid=SCHED[G.scen][G.turn];
  if(sid&&EV[sid]&&!G.fired[sid]&&evOK(EV[sid]))return sid;
  const pool=EVENTS.filter(e=>e.pool&&!G.fired[e.id]&&evOK(e));
  if(!pool.length||chance(.12))return 'quiet';
  const ws=pool.map(e=>typeof e.w==='function'?e.w():(e.w||1));
  let r=rnd()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i].id}
  return pool[pool.length-1].id;
}

/* ---------- 행동 ---------- */
/* 상태별 올바른 처치 — 약으로 낫지 않는 것(일산화탄소·저체온 등)은 약을 쓰지 않는다. 피부 오염은 '씻기' 행동으로만 */
const TREAT={
  bleed:{n:'직접압박·붕대',meds:1,t:m=>`두꺼운 거즈로 세게 눌러 붕대로 감았다. ${m.n}의 출혈이 멈췄다.`},
  co:{n:'신선한 공기·119',t:m=>`${josa(m.n,'을를')} 환기되는 출입구 쪽으로 옮기고 119에 알렸다. 두통이 가라앉는다.`},
  cold:{n:'체온 유지',need:()=>warmth(),t:m=>warmth()?`담요로 ${m.n}의 머리까지 감싸고 바닥 냉기를 막았다.`:`담요가 없어 겉옷과 박스를 덧댔다.`},
  heat:{n:'식히기·수분',t:m=>{res('water',-.5);return `그늘에서 물수건으로 ${m.n}의 목·겨드랑이를 식히고 물을 조금씩 먹였다.`}},
  sick:{n:'경구수액(ORS)',t:m=>{res('water',-1);return `물 1L에 설탕·소금을 타서 ${m.n}에게 조금씩 먹였다.`}},
  burn:{n:'식힌 뒤 거즈',meds:1,t:m=>`흐르는 물로 식힌 화상 부위를 깨끗한 거즈로 느슨하게 덮었다.`},
  fracture:{n:'부목 고정',t:m=>`박스와 잡지로 ${m.n}의 위·아래 관절까지 고정했다.`},
  injury:{n:'소독·붕대',meds:1,t:m=>`${m.n}의 상처를 씻고 붕대를 감았다.`},
  none:{n:'체력 회복',meds:1,t:m=>`${josa(m.n,'을를')} 눕히고 돌봤다.`}
};
function treat(m,c){const T=TREAT[c||'none'];let ok=true,used=false;
  if(T.meds){if(G.res.meds>0){res('meds',-1);used=true}else ok=chance(c==='bleed'?.75:.55)}
  if(c==='cold'&&!warmth())ok=chance(.5);
  const txt=T.t(m);
  if(ok){if(c==='fracture'){clrC(m,'fracture');addC(m,'injury')}else if(c)clrC(m,c);heal(m,used?14:8);return txt}
  heal(m,2);return txt+' 하지만 약과 도구가 모자라 상태가 크게 나아지지 않았다.'}
function needsCare(){const order=['bleed','co','cold','heat','sick','burn','fracture','injury'];
  let best=null,score=-1;G.fam.forEach(m=>{m.c.forEach(c=>{if(order.indexOf(c)<0)return;const s=100-order.indexOf(c);if(s>score){score=s;best={m,c}}});
    if(!m.c.length&&m.hp<65&&!m.crit&&score<1){score=1;best={m,c:null}}});return best}
const ACTIONS=[
  {id:'radio',n:'라디오 듣기',ic:'radio',d:()=>'정부 안내 · 다음 2번 힌트',show:()=>true,ok:()=>has('radio'),na:'라디오를 챙기지 못했다'},
  {id:'phone',n:'재난문자 확인',ic:'phone',d:()=>'힌트 1번 · 전력 −8%',show:()=>!has('radio'),ok:()=>G.res.power>=8&&!G.flags.emp,na:()=>G.flags.emp?'통신망 먹통':'전력 부족'},
  {id:'treat',n:'응급처치',ic:'aid',d:()=>{const n=needsCare();if(!n)return '다친 사람 없음';const how=TREAT[n.c||'none'];return `${n.m.n} · ${how.n}${how.meds?(G.res.meds?' · 약 1':' · 약 없음'):''}`},show:()=>true,ok:()=>!!needsCare(),na:'다친 사람 없음'},
  {id:'wash',n:'오염 씻어내기',ic:'drop',d:()=>G.flags.tap?'수돗물 사용':'물 3L 사용',show:()=>G.fam.some(m=>m.c.includes('contam')),ok:()=>G.flags.tap||G.res.water>=3},
  {id:'purify',n:'물 정수',ic:'bleach',d:()=>'수돗물 거르고 락스 · 물 +4L',show:()=>has('bleach')&&G.flags.tap&&G.scen==='conv',ok:()=>true},

/* ---------- 턴 종료 ---------- */
const RATION={full:{n:'충분히',w:1,f:.375,hp:2,mo:2,d:'1인 하루 4L · 1.5끼니'},base:{n:'기본',w:.5,f:.25,hp:0,mo:0,d:'1인 하루 2L · 1끼니'},save:{n:'절약',w:.25,f:.125,hp:-2,mo:-3,d:'1인 하루 1L · 0.5끼니'},lean:{n:'식량만 절약',w:.5,f:.125,hp:-1,mo:-2,d:'물 2L는 지키고 0.5끼니'}};
function endTurn(){
  FX=[];const notes=[];const n=G.fam.length;const R=RATION[G.ration];
  processDelayed(notes);
  let wNeed=R.w*n+.25*G.fam.filter(m=>m.c.includes('sick')).length+(G.season==='summer'&&G.loc!=='gym'?.1*n:0);
  let fNeed=R.f*n;
  const dry=G.res.water+1e-9<wNeed?1-G.res.water/wNeed:0; res('water',-Math.min(G.res.water,wNeed));
  const hungry=G.res.food+1e-9<fNeed?1-G.res.food/fNeed:0; res('food',-Math.min(G.res.food,fNeed));
  G.flags.dry=dry>0;
  if(dry>0){hurt('all',Math.round(9*dry));mor(-Math.round(5*dry));notes.push('물이 모자라 탈수가 시작됐다.')}
  else{if(R.hp)G.fam.forEach(m=>{if(R.hp>0)heal(m,R.hp);else hurt(m,-R.hp)});}
  if(hungry>0){hurt('all',Math.round(3*hungry));mor(-Math.round(4*hungry));notes.push('식량이 바닥나 기력이 떨어진다.')}
  if(R.mo)mor(R.mo);
  /* 상태이상 */
  G.fam.forEach(m=>m.c.forEach(c=>{let d=CONDS[c].hp;if(c==='cold'&&warmth())d=3;hurt(m,d)}));
  /* 오염·피폭 환경 */
  if(G.scen==='nuke'){if(G.turn<4){pol(G.loc==='home'?5:G.loc==='bldg'?2:1)}if(G.flags.noDecon&&G.turn<5)pol(3);if(G.loc==='park'&&G.flags.stayed)pol(2)}
  if(G.scen==='chem'&&G.flags.chemAlert&&G.loc!=='high')pol(10);
  if(G.pol>=70){hurt('all',6);notes.push((G.scen==='chem'?'오염':'피폭')+' 지수가 위험 수준이다.')}else if(G.pol>=40)hurt('all',3);
  /* 겨울 지하 냉기 */
  if((G.season==='winter')&&['park','bldg','subway'].includes(G.loc)&&!warmth())mor(-2);
  /* 사기 · 회복 · 전력 */
  mor(-1);
  if(G.morale<=20){hurt('all',2);notes.push('지친 가족들 사이에 다툼이 잦다.')}
  if(!dry&&!hungry&&G.morale>=45)G.fam.forEach(m=>{if(!m.c.length)heal(m,2)});
  if(!G.flags.emp&&G.res.power>0)res('power',G.flags.saver?-1:-2);
  /* 위독 · 게임오버 */
  G.fam.forEach(m=>{if(m.id!=='me'&&m.hp<=0&&!m.crit){m.crit=true;m.hp=1;G.morale=clamp(G.morale-15,0,100);notes.push(`${m.n} 위독 — 의식이 흐리다.`)}});
  if(M('me').hp<=0)G.over=true;
  G.turnFx=FX.slice();G.turnNotes=notes;
  return notes;
}

/* ---------- 엔딩 ---------- */
function computeEnding(){
  const scored=G.log.filter(l=>l.ok===true||l.ok===false);
  const right=scored.filter(l=>l.ok===true).length;
  const know=scored.length?Math.round(right/scored.length*100):50;
  const health=Math.round(G.fam.reduce((a,m)=>a+(m.crit?0:m.hp),0)/G.fam.length);
  const crit=G.fam.some(m=>m.crit);
  let score=know*.45+health*.35+G.morale*.1+(100-G.pol)*.1;
  if(crit)score=Math.min(score,55);
  if(know<50)score=Math.min(score,58);
  if(know<85)score=Math.min(score,87.9);
  if(know<70)score=Math.min(score,75.9);
  let grade=G.over?'F':score>=88?'S':score>=76?'A':score>=63?'B':score>=50?'C':'D';
  if(G.flags.flowClean)badge('flow');
  const T={S:'교과서 같은 72시간',A:'침착한 생존자',B:'무사히 버텼다',C:'상처 입은 생존',D:'운이 좋았다',F:'72시간을 버티지 못했다'};
  const sub={S:'수칙대로 움직였고, 가족 모두 건강하게 경보 해제를 맞았다.',A:'몇 번의 실수가 있었지만 판단은 대체로 옳았다.',B:'살아남았다. 다만 놓친 수칙이 생존 여유를 깎아 먹었다.',
    C:crit?'구조는 됐지만 가족 중 위독한 사람이 있어 긴급 이송됐다.':'살아남았지만 부상과 탈진이 깊다.',D:'잘못된 판단이 거듭됐다. 다음엔 운이 따르지 않을 수 있다.',
    F:'체력이 바닥나 의식을 잃었다. 무엇이 갈랐는지 아래 기록에서 확인하자.'};
  if(grade==='S')badge('perfect');
  if(G.scen==='nuke'&&!G.over&&G.pol<=20)badge('clean');
  if(G.flags.shared&&!G.over)badge('share');
  return{grade,title:T[grade],sub:sub[grade],know,right,total:scored.length,health,score:Math.round(score),crit};
}
function badge(id){const rec=getRec();if(!rec.badges[id]){rec.badges[id]=Date.now();setRec(rec);if(G&&!G.newBadges.includes(id))G.newBadges.push(id)}}
function getRec(){return store.get('sg.rec',{runs:0,best:{},badges:{},lessons:{},survived:{}})}

  const rec=getRec();rec.runs++;const order='FDCBAS';
  if(!rec.best[G.scen]||order.indexOf(end.grade)>order.indexOf(rec.best[G.scen]))rec.best[G.scen]=end.grade;
  G.log.forEach(l=>{if(l.ok!==null&&l.lesson)rec.lessons[l.id]=1});
  if(!G.over)rec.survived[G.scen]=1;

}

function bestUG(){const ug=G.home.sh.filter(s=>SHK[s.k].ug);return ug.length?ug.slice().sort((a,b)=>a.m-b.m)[0]:null}
function setShelter(s,fallback){if(s){G.loc=SHK[s.k].loc;G.locName=s.n;G.shUG=!!SHK[s.k].ug}else{G.loc=fallback||'bldg';G.locName=null;G.shUG=true}}
function goShelter(s){setShelter(s);const ug=SHK[s.k].ug;let t=`${s.n}까지 도보 ${s.m}분.`;
  if(!ug){mor(-4);if(G.scen!=='chem'&&chance(.45)){const v=victim();hurt(v,10);addC(v,'injury');return t+` 지상 건물이라 폭음이 날 때마다 유리창이 흔들렸다. ${josa(v.n,'이가')} 깨진 유리에 다쳤다.`}return t+' 지상 건물이라 폭음이 날 때마다 유리창이 흔들린다.'}
  if(s.m>3){if(G.scen==='chem')pol(Math.min(15,s.m));else if(chance(Math.min(.6,.05*s.m))){const v=victim();hurt(v,12);addC(v,'injury');return t+` 걷는 사이 근처에서 폭발. ${josa(v.n,'이가')} 파편에 다쳤다.`}return t+' 사이렌 속을 걸어 겨우 닿았다.'}
  return t+' 형광등 아래 이웃들이 모여 있다.'}

    {t:'라디오·재난문자로 공식 안내를 확인한다',ok:true,go:()=>{badge('rumor');if(has('radio')||(G.res.power>=5&&!G.flags.emp)){if(!has('radio'))res('power',-3);if(G.scen==='conv')reveal();mor(5);return '공식 안내: "대피소에 머물고 이동을 자제하십시오." 소문은 거짓이었다.'}mor(1);return '확인할 수단이 없다. 그래도 공식 안내 없이는 움직이지 않기로 했다.'}},
    {t:'우리도 지금 남쪽으로 출발한다',ok:false,go:()=>{hurt('all',10);mor(-10);return '도로는 이미 마비. 2차 경보에 차를 버리고 터널로 뛰었다가 새벽에 돌아왔다.'}},
    {t:'소문을 다른 단톡방에도 전달한다',ok:false,go:()=>{mor(-2);delay(1,'rumorFall');return '몇 사람이 짐을 싸서 대피소를 나갔다.'}}
  ],lesson:'유언비어에 동요하지 말 것. 재난문자·KBS 재난방송으로 확인되기 전에는 움직이지 않는다.',src:SRC.air});
E({id:'blackout',art:'torch',tone:'amber',cat:'정전',title:'불이 꺼졌다',
  text:()=>`${G.loc==='home'||G.loc==='high'?'단지 전체가 정전됐다.':'대피소 조명이 한꺼번에 나갔다.'} 칠흑 같은 어둠 속에서 ${hasKid()?kidN()+'의 울음소리':'누군가의 비명'}와 발소리가 뒤섞인다.`,
  hint:'조명은 양초보다 손전등. 휴대폰 배터리는 통신용으로 아낀다.',
  choices:[
    {t:'손전등을 켠다',need:()=>has('torch'),na:'손전등 없음',ok:true,go:()=>{G.flags.blackout=1;G.flags.light='torch';mor(4);return '작은 불빛 하나에 주변 사람들이 모여들었다. 넘어지는 사람이 줄었다.'}},
    {t:'양초에 불을 붙인다',need:()=>has('candle'),na:'양초 없음',ok:false,go:()=>{G.flags.blackout=1;G.flags.light='candle';if(chance(.45)){const v=victim();addC(v,'burn');hurt(v,8);return `누군가 발에 걸려 양초가 넘어졌다. ${v.n}의 손등에 화상.`}mor(-2);return '불빛은 생겼지만 사람들이 불안해한다. 밀폐된 지하의 불꽃은 2차 화재 위험이다.'}},
    {t:'휴대폰 플래시를 켠다',need:()=>G.res.power>=5&&!G.flags.emp,na:'배터리 부족',ok:false,go:()=>{G.flags.blackout=1;G.flags.light='phone';res('power',-12);return '빛은 얻었지만 배터리가 12% 줄었다. 통신이 끊기면 안 되는 상황이다.'}},
    {t:'어둠 속에서 가만히 기다린다',ok:null,go:()=>{G.flags.blackout=1;mor(-6);return '버틸 수는 있었다. 하지만 화장실을 다녀오던 이웃이 넘어져 다쳤다.'}}
  ],lesson:'정전 때 조명은 양초보다 손전등이 원칙이다. 혼란 속 양초는 2차 화재 원인이고, 휴대폰 배터리는 재난문자·연락용으로 남긴다.',src:'행정안전부 정전 대비 국민행동요령 · 생존 수첩'});
E({id:'gohome',art:'fire',tone:'red',cat:'화재',cond:()=>G.loc!=='home',title:'우리 동에 불이 났다',
  text:()=>`"○동 고층에 불났대!" 우리 동이다. ${M('sp')?spN('이가')+' "통장이랑 사진이라도 가지러 가자"며 일어선다.':'당신도 모르게 자리에서 일어섰다. 통장이랑 사진이라도…'}`,
  hint:'물건은 대체되지만 몸은 아니다. 엘리베이터 금지, 연기는 계단을 타고 올라간다.',
  choices:[
    {t:'올라가지 않는다. 119에 신고하고 대피소를 지킨다',ok:true,go:()=>{if(G.flags.gas&&G.flags.breaker){mor(4);return '불은 2시간 만에 꺼졌다. 가스·전기를 차단해 둔 덕분에 우리 집은 그을음만 입었다.'}G.flags.homeDamaged=1;mor(-3);return '불은 2시간 만에 꺼졌다. 계단으로 올라갔던 몇 명이 연기를 마시고 실려 내려왔다. 우리 집 주방까지 불길이 번졌다고 한다.'}},
    {t:'빨리 다녀온다 — 엘리베이터로',ok:false,go:()=>{hurt('me',25);addC(M('me'),'co');return '엘리베이터가 연기 찬 층에서 멈췄다. 연기를 들이마시고 겨우 계단으로 빠져나왔다.'}},
    {t:'계단으로 뛰어 올라간다',ok:false,go:()=>{hurt('me',16);addC(M('me'),'co');return '8층부터 연기가 계단을 타고 내려왔다. 기침을 하며 되돌아왔다.'}}
  ],lesson:'불난 건물에 물건을 가지러 들어가지 않는다. 엘리베이터는 절대 금지이고, 연기는 계단을 굴뚝 삼아 올라간다.',src:SRC.fire});
E({id:'second',art:'siren',tone:'red',cat:'2차 공습',cond:()=>G.loc!=='home',title:'잠깐 집에 다녀오자',
  text:'6시간째 조용하다. "경보 해제 전이라도 잠깐 올라가 약이랑 옷만 가져오자"는 말이 나온다. 경보는 아직 해제되지 않았다.',
  hint:'조용해진 것은 해제가 아니다. 경보해제 음성방송이 나올 때까지 대피소에서 대기한다.',
  choices:[
    {t:'경보가 해제될 때까지 기다린다',ok:true,go:()=>{mor(-2);return '30분 뒤 다시 사이렌. 2차 공습이었다. 올라갔던 사람들은 계단에서 엎드려야 했다.'}},
    {t:'10분이면 된다, 빨리 다녀온다',ok:false,go:()=>{if(chance(.5)){res('meds',2);give('blanket');return '운 좋게 약과 담요를 챙겨 내려왔다. 하지만 계단에서 2차 사이렌을 들었다.'}hurt('me',20);addC(M('me'),'bleed');return '계단에서 2차 폭발. 깨진 창유리에 다리를 베었다. 피가 멈추지 않는다.'}}
  ],lesson:'조용해진 것은 해제가 아니다. 재난문자·라디오로 안내를 듣고, 경보해제(음성방송)가 나올 때까지 대피소에서 대기한다.',src:SRC.alarm});
E({id:'relief',art:'water',tone:'green',cat:'구호',title:'구호품 배부',
  text:()=>G.loc==='high'?'관리사무소 방송: "1층 로비에서 생수를 나눠 드립니다. 마스크를 쓰고, 세대별 신원을 확인합니다."':'구청 직원들이 생수와 담요를 나눠준다. 세대별로 신원을 확인해 명단에 올린다.',
  choices:[
    {t:'신분증을 보여주고 등록한다',need:()=>has('wallet'),na:'신분증 없음',ok:null,go:()=>{const n=G.fam.length;res('water',2*n);give('blanket');mor(5);return `확인은 1분. 생수 ${2*n}L와 은박담요를 받았다. 가족 명단도 올라가 실종 확인 대상에서 빠졌다.`}},
    {t:'신분증 없이 구두로 설명하고 기다린다',ok:null,go:()=>{res('water',G.fam.length);mor(1);return `확인에 시간이 걸려 맨 뒤로 밀렸다. 생수 ${G.fam.length}L만 남아 있었다.`}},
    {t:'혼잡한 틈에 한 상자 더 챙긴다',ok:false,go:()=>{res('water',6);delay(1,'distrust');return '물 6L가 늘었다. 아무도 뭐라 하지 않았다.'}}

E({id:'decon',art:'rad',tone:'red',cat:'제염',title:'회색 먼지',

  hint:'겉옷을 벗어 비닐에 밀봉하면 방사성 물질을 최대 90%까지 제거한다. 문지르지 않는다.',

    {t:'물티슈로 피부를 세게 문질러 닦는다',ok:false,go:()=>{G.flags.decon=1;pol(10);return '문지르는 동안 피부가 붉게 일어났다. 긁힌 피부로 오염이 더 스며들 수 있다.'}}

E({id:'ki',art:'pill',tone:'amber',cat:'약',title:'요오드 알약',

    {t:'받아서 가족 모두 지금 먹는다',ok:false,go:()=>{hurt('all',6);return '복통과 메스꺼움. KI는 갑상선만, 그것도 방사성 요오드만 막는다. 불필요한 복용은 위험하다.'}},

E({id:'outside',art:'store',tone:'red',cat:'외출 유혹',title:'편의점에 생수가 있다',
  text:'폭발 후 약 18시간. 이웃이 "길 건너 편의점 생수 가져오자, 지금 아무도 없다"며 같이 가자고 한다.',

  choices:[
    {t:'최소 24시간은 나가지 않는다. 물은 필요한 만큼 마시고, 활동과 식량을 줄인다',ok:true,go:()=>{mor(-2);return '나갔던 이웃은 생수를 들고 왔지만, 다음 날부터 심하게 구토했다.'}},
    {t:'마스크 쓰고 빠르게 다녀온다',ok:false,go:()=>{res('water',8);pol(30);delay(2,'radNausea');return '생수 8L를 들고 무사히 돌아왔다. 밖은 이상할 만큼 고요했다.'}}
  ],lesson:'낙진의 방사선은 처음 몇 시간이 가장 강하다. 최소 24시간은 실내에 머물고, 물자 확보는 정부 안내 이후로 미룬다. 당국 지시가 없으면 마실 물은 줄이지 않는다.',src:SRC.nuke+' · Ready.gov 식수 관리'});

  ],lesson:'핵 공격 후 가족이 흩어져 있어도 각자 실내 대기가 더 안전하다. 재회는 정부 이동 지시 이후로 미룬다.',src:'행정안전부 핵공격 국민행동요령'});

/* 장식용 결정적 난수 — 게임 난수와 분리해 그림이 매번 같게 */
function lcg(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const C={sky1:'#0a1320',sky2:'#1b2232',glow:'#5a2a14',tower:'#121a23',tower2:'#18222d',win:'#ffb224',winDim:'#3a3220',con:'#20272e',con2:'#2a323b',line:'#36414c',amber:'#ffb224',exit:'#2ccf7c',red:'#ff5449',skin:'#c9d3dc',hz:'#e8c11a'};

/* 국제 민방위 표지 — 주황 바탕 위 파란 정삼각형 (제네바 협약 제1추가의정서 제66조) */
function cdMark(sz){return `<svg class="cd-mark" viewBox="0 0 42 42" width="${sz||42}" height="${sz||42}" aria-hidden="true"><rect width="42" height="42" rx="10" fill="#f08a24"/><path d="M21 8 34 31H8z" fill="#2e6bd6"/></svg>`}

/* ---------- 도시 야경 (타이틀·엔딩) ---------- */
function skyline(mode){/* mode: night | dawn | dark */
  const r=lcg(7);const W=400,H=250;let s='';
  const sky=mode==='dawn'?['#1b2740','#7a4a3a','#d98a4e']:mode==='dark'?['#07090d','#120d0c','#2a120c']:[C.sky1,C.sky2,'#3a1c14'];
  s+=`<defs><linearGradient id="sk${mode}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset=".72" stop-color="${sky[1]}"/><stop offset="1" stop-color="${sky[2]}"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#cfe3ff" stop-opacity=".32"/><stop offset="1" stop-color="#cfe3ff" stop-opacity="0"/></linearGradient></defs>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#sk${mode})"/>`;
  if(mode==='dawn'){s+=`<circle cx="318" cy="214" r="34" fill="#ffc46b" opacity=".85"/>`}
  else{for(let i=0;i<34;i++){s+=`<circle cx="${(r()*W).toFixed(1)}" cy="${(r()*120).toFixed(1)}" r="${(r()*1+.3).toFixed(2)}" fill="#dfe8f2" opacity="${(r()*.6+.2).toFixed(2)}"/>`}}

function planMePos(room){const c=roomC(room);const off={master:[24,10],bath:[0,14],kid:[-30,14],living:[-12,-2],kitchen:[-34,14],hall:[30,8],util:[-40,4]}[room]||[0,0];return{x:c.x+off[0],y:c.y+off[1]}}

/* ---------- 가족 실루엣 ---------- */
function hpColor(m){return m.crit?C.red:m.hp>60?C.skin:m.hp>30?C.amber:C.red}
function figure(x,y,sc,col,label,sitting){/* 앉은 사람 */
  return `<g transform="translate(${x} ${y}) scale(${sc})"><g class="breath"><circle cx="0" cy="-30" r="7.5" fill="${col}"/><path d="M-11 0 C-11 -16 -8 -21 0 -21 C8 -21 11 -16 11 0 Z" fill="${col}"/>${sitting?`<path d="M-11 0h24v5h-24z" fill="${col}" opacity=".8"/>`:''}</g>${label?`<text y="16" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9.5" font-weight="800" fill="#cfd7de">${label}</text>`:''}</g>`}
function neighbor(x,y,sc,o){return `<g transform="translate(${x} ${y}) scale(${sc})" opacity="${o||.55}"><circle cy="-28" r="7" fill="#3c4855"/><path d="M-10 0C-10-15-7-20 0-20S10-15 10 0Z" fill="#3c4855"/></g>`}
function famGroup(cx,base){let s='';const n=G.fam.length;const gap=n>=4?30:n===3?37:40;const xs=G.fam.map((_,i)=>Math.round(cx+(i-(n-1)/2)*gap));
  G.fam.forEach((m,i)=>{const sc=m.k==='kid'?.72:m.k==='eld'?.9:.95;s+=figure(xs[i],base-(m.k==='kid'?2:0),sc,hpColor(m),m.n,1);
    if(m.c.length){s+=`<g transform="translate(${xs[i]+8} ${base-42})"><circle r="6.5" fill="#361613" stroke="${C.red}" stroke-width="1"/><use href="#i-${CONDS[m.c[0]].ic}" x="-4.5" y="-4.5" width="9" height="9" fill="none" stroke="${C.red}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>`}});
  return s}
function supX(cx){const n=G.fam.length;const gap=n>=4?30:n===3?37:40;return Math.round(cx+(n-1)/2*gap+34)}
function supplies(x,y){/* 물·식량을 그림으로: 생수병 개수 = 2L 단위 */
  let s='';const bottles=Math.min(8,Math.ceil(G.res.water/2));
  for(let i=0;i<bottles;i++){const bx=x+i*7,by=y;s+=`<path d="M${bx+1} ${by-15}h3v2l1.4 2v11h-5.8v-11l1.4-2z" fill="#5aa8ff" opacity=".75"/>`}
  const cans=Math.min(5,Math.ceil(G.res.food/2));for(let i=0;i<cans;i++){s+=`<rect x="${x+64+(i%3)*8}" y="${y-8-(i>2?8:0)}" width="7" height="8" rx="1.5" fill="#b9874a" opacity=".85"/>`}
  if(has('radio'))s+=`<g transform="translate(${x+92} ${y-14})"><rect width="20" height="13" rx="2" fill="#3a4652"/><circle cx="6" cy="7" r="3" fill="#1b232b"/><path d="M4 0 14 -6" stroke="#7d8b98" stroke-width="1.2"/></g>`;
  return s}

/* ---------- 결정 카드 (공용) ---------- */
function choicesOf(ev){return val(ev.choices)}
/* 선택지 순서를 매번 섞는다 — 정답 위치로 맞히지 못하게 */
function permFor(n){if(!G||!G.cur)return [...Array(n).keys()];if(!G.cur.perm||G.cur.perm.length!==n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}G.cur.perm=a}return G.cur.perm}
function eventCard(ev,opt){
  opt=opt||{};const cs=choicesOf(ev);const toneC={red:'red',blue:'blue',green:'green'}[ev.tone]||'';
  const hintTxt=val(ev.hint);let hint='';
  if(hintTxt){const src=G.cur&&G.cur.hs?G.cur.hs:null;if(src)hint=`<div class="hint"><span class="eyebrow">${src.l}</span>${hintTxt}</div>`}
  return `<div class="sheet fade-in">
    <div class="lead"><div class="badge ${toneC}">${ic(ev.art||'dot')}</div><div style="min-width:0"><div class="eyebrow">${ev.cat||''}</div><h2>${val(ev.title)}</h2></div></div>
    <p>${val(ev.text)}</p>${hint}
    ${ev.timed?`<div class="timebar"><i id="tbar"></i></div>`:''}
    <div class="choices">${permFor(cs.length).map((i,pos)=>{const c=cs[i];const okNeed=!c.need||c.need();return `<button class="choice" data-a="choose" data-i="${i}" ${okNeed?'':'disabled'}><span class="k">${'ABCD'[pos]}</span><span class="ct"><b>${val(c.t)}</b>${c.s||!okNeed?`<small>${okNeed?c.s:val(c.na)||'불가'}</small>`:''}</span></button>`}).join('')}</div>
  </div>`;
}
function fxChips(arr){if(!arr||!arr.length)return '';const seen=[];
  return `<div class="fx-list">${arr.map(f=>{const l=typeof f.l==='object'?'':f.l;if(f.n===null)return `<span class="fx down">${l}</span>`;
    const up=f.l==='피폭'||f.l==='오염'?f.n<0:f.n>0;return `<span class="fx ${up?'up':'down'}">${l} ${f.n>0?'+':''}${f.n}${f.u}</span>`}).join('')}</div>`}
function resultCard(ev,r,btn){
  const cs=choicesOf(ev);
  const hide=G.hide;const lesson=hide?null:val(ev.lesson);
  const ok=hide?null:r.ok;const L=r.i>=0&&G.cur&&G.cur.perm?'ABCD'[G.cur.perm.indexOf(r.i)]:'ABCD'[r.i];const box=lesson?`<div class="lesson ${ok===true?'ok':ok===false?'no':''}"><span class="eyebrow">${ok===true?'수칙대로 했다':ok===false?'실제 수칙':'생각해 볼 점'}</span><div>${lesson}</div>${ev.src?`<span class="src">출처 · ${val(ev.src)}</span>`:''}</div>`:'';

    <p class="result">${r.text}</p>${fxChips(r.fx)}${box}${hide&&val(ev.lesson)?`<p class="small faint" style="margin:0">옳은 판단이었는지는 72시간이 끝난 뒤 판단 기록에서 공개된다.</p>`:''}

}

function moveFloor(ev){if(ev==='mv_elev'||!ev)return HF()+'F';if(['mv_conv','mv_nuke','mv_chem'].includes(ev))return (G.flags.elev?1:(G.dmid||1))+'F';if(ev==='road')return '';return '1F'}
function vMove(){

function grabSummaryCard(){
  const g=G.grab;const items=g.picked.filter(id=>!ITEMS[id].act&&!ITEMS[id].fam);

    <div class="bag">${Array.from({length:10},(_,i)=>{const id=gSlotsOf(items)[i];return `<div class="slot${id?' f':''}">${id?ic(ITEMS[id].ic):''}</div>`}).join('')}</div>

function gSlotsOf(ids){const out=[];ids.forEach(id=>{const s=ITEMS[id].s||0;for(let k=0;k<s;k++)out.push(id)});return out}

/* ---------- HUD ---------- */
function hud(){
  const ph=G.phase;let clk,sub;
  if(ph==='shelter'){clk=`T+${G.turn*6}h`;sub=`${clockAt(G.turn)} · ${dayOf(Math.min(G.turn,11))}일차`}
  else if(ph==='move'){clk=simClock(G.simT||60);sub='대피 이동'}else{clk='23:08';sub=''}

function famStrip(){return `<div class="fam" data-n="${G.fam.length}">${G.fam.map(m=>{const c=hpColor(m);return `<div class="mem${m.crit?' crit':''}"><div class="top"><b>${m.n}</b><span class="hp">${m.crit?'위독':m.hp}</span></div><div class="bar"><i style="width:${m.crit?3:m.hp}%;background:${c}"></i></div><div class="conds">${m.c.length?m.c.map(k=>`<span class="cond">${ic(CONDS[k].ic)}${CONDS[k].n}</span>`).join(''):`<span class="cond ok">${ic('check')}이상 없음</span>`}</div></div>`}).join('')}</div>`}
function resGrid(){
  const n=G.fam.length;const days=G.res.water/(RATION[G.ration].w*4*n);

    ['water',`${fmtL(G.res.water)}L`,`물 · ${days>=10?'충분':days.toFixed(1)+'일분'}`,G.res.water<n*2],

    sheet=resultCard(ev,G.cur.r,last?{a:'to-end',t:'72시간 — 결과 보기'}:G.cur.next?{a:'follow',t:'계속'}:{a:'to-action',t:'이 6시간 동안 할 일'})}

function quietCard(){return `<div class="sheet fade-in"><div class="lead"><div class="badge">${ic('moon')}</div><div><div class="eyebrow">조용한 시간</div><h2>숨 돌릴 6시간</h2></div></div><p>${G.cur.q}</p><button class="btn pri" data-a="to-action">이 6시간 동안 할 일</button></div>`}
function rationCard(){
  const n=G.fam.length;const day=dayOf(G.turn);

  <div class="choices">${['full','base','lean','save'].map((k,i)=>`<button class="choice" data-a="ration" data-v="${k}"><span class="k">${'ABCD'[i]}</span><span class="ct"><b>${RATION[k].n} — ${RATION[k].d}</b><small>${est(k)} · ${k==='full'?'체력·사기 회복':k==='base'?'최소 음용량 유지':k==='lean'?'물은 지키고 식량을 아낀다':'탈수 위험 · 당국 지시 없이 권장되지 않음'}</small></span></button>`).join('')}</div></div>`;
}
function actionCard(){

  <div class="actions">${acts.map(a=>{const ok=a.ok();return `<button class="act${a.warn&&a.warn()?' warn':''}" data-a="act" data-v="${a.id}" ${ok?'':'disabled'}>${ic(a.ic)}<b>${a.n}</b><small>${ok?a.d():val(a.na)||'지금은 불가'}</small></button>`}).join('')}</div></div>`;

function actResCard(){

  return `<div class="sheet fade-in"><div class="lead"><div class="badge">${ic(ACTIONS.find(a=>a.id===c.act).ic)}</div><div><div class="eyebrow">${ACTIONS.find(a=>a.id===c.act).n}</div><h2>${clockAt(G.turn+1)}까지</h2></div></div>
  <p class="result">${c.at}</p>${fxChips(c.afx)}

  <button class="btn pri" data-a="next-turn">${last?'마지막 밤을 넘긴다':`T+${(G.turn+1)*6}h로`}</button></div>`;

/* ---------- 흐름 ---------- */
function startGame(){
  store.set('sg.setup',UI.setup);newGame(UI.setup);G.phase='alert';G.cur={ev:'alert0',hs:hintSource()};save();
  setScreen('alert');later(()=>{SND.cbs();vib([200,100,200,100,400])},350);
  later(()=>broadcast('민방위 음성방송 · 게임 속 가상 방송','경계경보. 경계경보. 적의 공격이 예상됩니다. 주민 여러분은 대피를 준비하시고, 어린이와 노약자는 가까운 대피소로 먼저 대피하십시오.'),1900);
}
function chooseOn(ev,i,after){
  const cs=choicesOf(ev);const c=cs[i];if(!c||(c.need&&!c.need()))return;
  if(ev.timed&&G.cur.t0)G.rt=performance.now()-G.cur.t0;
  clearTimers();
  const finish=sc=>{FX=[];const text=c.go(sc);G.cur.r={i,ok:c.ok,text,fx:FX.slice()};logDecision(ev,c,c.ok);
    if(G.hide)SND.pick();else if(c.ok===true)SND.ok();else if(c.ok===false){SND.bad();vib(60)}after()};
  if(c.mini)startMini(c.mini,finish);else finish();
}
function timeoutOn(ev,after){FX=[];const text=ev.timeout();G.cur.r={i:-1,ok:false,text,fx:FX.slice()};logDecision(ev,null,false,'시간 초과');if(G.hide)SND.pick();else SND.bad();vib(80);after()}
function armTimed(ev,after){
  if(!ev.timed)return;G.cur.t0=performance.now();
  const bar=$('#tbar');if(bar){bar.style.transition='none';bar.style.transform='scaleX(1)';void bar.offsetWidth;bar.style.transition=`transform ${ev.timed}s linear`;bar.style.transform='scaleX(0)'}
  later(()=>timeoutOn(ev,after),ev.timed*1000);
  for(let k=1;k<ev.timed;k++)later(()=>SND.tick(),k*1000);
}
/* 이동 */
function moveNext(){
  if(!G.moveQ.length){toShelter();return}
  const id=G.moveQ.shift();
  if(id.indexOf('D:')===0){
    if(id!=='D:B'&&G.flags.elev){moveNext();return}
    if(id==='D:B'&&(!G.shUG||G.loc==='home')){moveNext();return}
    startDescent(id);return}
  UI.screen='move';G.cur={ev:id,hs:hintSource()};consumeHint(G.cur.hs);G.step='card';
  if(id==='mv_conv')G.flags.stairDark=chance(.5)?1:0;
  if(id==='mv_nuke')G.flags.stairDark=chance(.6)?1:0;
  if(id==='mv_chem')G.flags.chemSmell=1;
  UI.after=()=>{const ev=EV[id];if(ev.flash){flash();SND.boom(true);vib([400,80,600]);stun()}else if(id==='mv_conv'){SND.boom();shake();vib([150,50,250])}else if(id==='road'){SND.siren(10)}
    armTimed(ev,()=>{G.step='result';save();render()})};
  render();
}
function toShelter(){SND.stopSiren();G.phase='shelter';G.turn=0;G.cur=null;beginTurn();save();setScreen('shelter')}
function beginTurn(){
  if(G.turn>=12){const id=FINAL[G.scen];G.cur={ev:id,hs:hintSource()};consumeHint(G.cur.hs);G.step='final';return}
  if(G.turn%4===0&&!G.flags['r'+G.turn]){G.step='ration';G.cur={};return}
  enterEvent();
}
function enterEvent(){
  const id=pickEvent();G.cur={ev:id};G.step='event';
  if(id==='quiet'){G.cur.q=pick(QUIET);return}
  const ev=EV[id];G.fired[id]=1;if(ev.pre)ev.pre();
  if(G.scen==='conv'&&G.turn>=3)G.scenKnown=true;
  G.cur.hs=val(ev.hint)?hintSource():null;consumeHint(G.cur.hs);
}
function afterEventResult(){
  if(checkOver()){toEnd();return}
  G.step=G.step==='final'?'fresult':'result';save();render();
}
function toEnd(){SND.stopSiren();if(!G.end){G.end=computeEnding();G.phase='end';recordRun(G.end);clearSave()}setScreen('end')}

/* ---------- 클릭 처리 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a;SND.ac();
  if(a==='snd'){SND.on=!SND.on;store.set('sg.snd',SND.on);if(!SND.on)SND.stopSiren();b.innerHTML=ic(SND.on?'sound':'mute');return}
  if(a==='home'){clearTimers();SND.stopSiren();GR.running=false;DS.on=false;if(DS.prompt){clearTimeout(DS.prompt.to);DS.prompt=null}hush();setScreen('title');return}
  if(a==='family'){UI.my=null;UI.famBack=UI.screen==='setup'?'setup':'title';setScreen('family');return}
  if(a==='my-opt'){myOpt(b.dataset.k,b.dataset.v);render();return}
  if(a==='my-import'){myImport();render();toast('생존 수첩에 적어 둔 대피소·집결지를 불러왔다.');return}
  if(a==='my-save'){mySave();return}
  if(a==='my-back'){setScreen(UI.famBack||'title');return}
  if(a==='setup'){UI.setup=null;setScreen('setup');return}
  if(a==='records'){setScreen('records');return}
  if(a==='opt'){const k=b.dataset.k;let v=b.dataset.v;if(k==='fam'){if(v==='my'){if(!getMy()){UI.my=null;UI.famBack='setup';setScreen('family');return}}else v=+v}UI.setup[k]=v;render();return}
  if(a==='start'){startGame();return}
  if(a==='resume'){const sv=loadSave();if(!sv)return;G=sv;RNG.s=sv.rngS||1;
    if(G.phase==='grab'){startGrab();return}
    if(G.phase==='alert'){setScreen('alert');return}
    if(G.phase==='move'){UI.screen='move';if(G.step==='descent'){G.moveQ.unshift(G.dsId);moveNext();return}if(G.step==='card'){G.moveQ.unshift(G.cur.ev);moveNext();return}setScreen('move');return}
    setScreen('shelter');return}
  if(a==='again'){UI.setup=Object.assign({},G.opts);delete UI.setup.seed;startGame();return}
  if(a==='menu'){menuOverlay();return}
  if(a==='quit'){$('#ov')&&$('#ov').remove();if(UI.screen==='descent'){DS.on=false;if(DS.prompt){clearTimeout(DS.prompt.to);DS.prompt=null}}save();clearTimers();SND.stopSiren();hush();setScreen('title');return}
  if(a==='close-ov'){$('#ov')&&$('#ov').remove();return}
  /* 결정 */
  if(a==='choose'){const i=+b.dataset.i;
    if(UI.screen==='alert'){chooseOn(EV.alert0,i,()=>{save();$('#app').querySelector('.sheet').outerHTML=resultCard(EV.alert0,G.cur.r,{a:'to-grab',t:G.flags.car?'짐 싣기 (40초)':'사이렌 — 60초 탈출'})});return}
    if(UI.screen==='move'){chooseOn(EV[G.cur.ev],i,()=>{G.step='result';if(G.cur.ev==='mv_nuke'){later(()=>{SND.boom(true);shake();vib([300,60,500])},400)}save();render()});return}
    if(UI.screen==='shelter'){chooseOn(EV[G.cur.ev],i,afterEventResult);return}}
  if(a==='to-grab'){startGrab();return}
  if(a==='move-start'){moveNext();return}
  if(a==='move-next'){if(checkOver()){toEnd();return}moveNext();return}
  if(a==='ration'){G.ration=b.dataset.v;G.flags['r'+G.turn]=1;enterEvent();save();render();return}
  if(a==='follow'){const nx=G.cur.next;G.cur={ev:nx,hs:hintSource()};consumeHint(G.cur.hs);G.fired[nx]=1;G.step='event';save();render();return}
  if(a==='to-action'){G.step='action';save();render();return}
  if(a==='act'){const id=b.dataset.v;const at=doAction(id);const afx=FX.slice();
    if(id==='radio'){const q=(at.match(/"([^"]+)"/)||[])[1];if(q)later(()=>broadcast('KBS 재난방송 · 게임 속 가상 방송',q),400)}
    if(checkOver()){toEnd();return}
    endTurn();G.cur={act:id,at,afx};G.step='actres';if(G.over){save();render();later(toEnd,1600);return}save();render();return}
  if(a==='next-turn'){if(G.over){toEnd();return}G.turn++;beginTurn();save();render();window.scrollTo(0,0);return}
  if(a==='to-end'){toEnd();return}
});

/* ---------- 루프 ---------- */
function dsLoop(now){
  if(!DS.on)return;
  const dt=Math.min(.05,(now-DS.last)/1000);DS.last=now;DS.t+=dt;
  const J=DS.jam;
  /* 정체 진행 */
  if(J){J.age+=dt;
    if(J.stage==='warn'&&J.age>=J.warn){J.stage='stop';J.age=0;dsNote('앞이 멈췄다 — 손을 떼고 기다린다.');SND.tone(220,.12,'square',.03)}
    else if(J.stage==='stop'){
      if(DS.hold&&J.age>.35&&!J.bumped){J.bumped=1;dsBump()}
      if(J.age>=J.len){DS.jam=null;dsNote('앞이 다시 움직인다.');DS.nextJam=DS.pos-(1.1+rnd()*1.6)/Math.max(.4,DS.density)}}}
  else if(!DS.prompt&&DS.pos<=DS.nextJam&&DS.pos>DS.to+.3){DS.jam={stage:'warn',age:0,warn:DS.dark&&DS.light!=='torch'?.35:.75,len:1.6+rnd()*1.4,bumped:0};dsNote('앞사람이 느려진다…')}
  /* 이동 */
  let moving=false;
  if(DS.hold&&!DS.prompt&&!(DS.jam&&DS.jam.stage==='stop')){
    let sp=DS.carry?.5:DS.slow;
    if(DS.dark&&DS.light!=='torch')sp*=DS.light==='phone'?.78:.6;
    if(DS.stam<25)sp*=.6;
    if(DS.jam&&DS.jam.stage==='warn')sp*=.55;
    DS.pos-=sp*dt;moving=true;
    DS.stam=clamp(DS.stam-(DS.carry?7.5:2.6)*dt,0,100);
    G.simT=(G.simT||60)+dt*42;
  }else{DS.stam=clamp(DS.stam+9*dt,0,100);G.simT=(G.simT||60)+dt*6}
  /* 발소리 · 심장 */
  if(moving){DS.stepAcc+=dt;if(DS.stepAcc>.34){DS.stepAcc=0;SND.tone(110+Math.random()*30,.07,'sine',.07)}}
  if(DS.stam<30){DS.beatAcc+=dt;if(DS.beatAcc>.75){DS.beatAcc=0;SND.heart()}}
  /* 층 넘김 */
  const fl=Math.ceil(DS.pos);
  if(fl<DS.lastFl){DS.lastFl=fl;const n=$('#dsNum');if(n){n.textContent=flTag(fl);n.classList.remove('tick');void n.getBoundingClientRect();n.classList.add('tick')}
    if(DS.dark&&DS.light==='phone')res('power',-1);vib(8)}
  /* 끼어드는 상황 */
  if(!DS.prompt){
    if(DS.dropAt!==null&&DS.pos<=DS.dropAt){DS.dropAt=null;dsPromptDrop()}
    else if(DS.kidAt!==null&&DS.pos<=DS.kidAt){DS.kidAt=null;dsPromptKid()}
  }
  dsDraw(moving);
  if(DS.pos<=DS.to){dsArrive();return}
  UI.raf=requestAnimationFrame(dsLoop);
}

}
function dsResolve(k){const pr=DS.prompt;if(!pr)return;if(UI.screen!=='descent'){clearTimeout(pr.to);DS.prompt=null;return}clearTimeout(pr.to);DS.prompt=null;const p=$('#dsPrompt');if(p)p.hidden=true;
  FX=[];pr.done(k);const fx=FX.slice();if(fx.length)toast(fx.map(f=>typeof f.l==='string'?`${f.l}${f.n===null?'':' '+(f.n>0?'+':'')+f.n+f.u}`:'').join(' · '),2200);
  if(M('me').hp<=0){DS.on=false;save();later(toEnd,900)}}
function dsCarryBtn(){const b=$('#dsCarry span');if(b)b.textContent=DS.carry?`${kidN('을를')} 내려놓기 (체력 회복)`:`${kidN('을를')} 안아 올리기`}

/* ---------- 도착 ---------- */
function dsArrive(){
  DS.on=false;DS.hold=false;cancelAnimationFrame(UI.raf);wake(false);
  if(DS.id==='D:A2'){const b=G.flags.bumps||0;logD('d_flow',b?1:0);if(!b&&!G.log.some(l=>l.id==='d_fall'||(l.id==='d_drop'&&l.ok===false)))G.flags.flowClean=1}
  dsNote(DS.to>=1?`${flName(DS.to)} 도착.`:'지하 2층 도착.');SND.tone(523,.12,'triangle',.06);
  save();later(()=>{UI.screen='move';moveNext()},700);
}

/* ---------- 입력 ---------- */
document.addEventListener('pointerdown',e=>{if(e.target.closest('#dsPad')&&UI.screen==='descent'&&DS.on){e.preventDefault();DS.hold=true;SND.ac()}});
document.addEventListener('pointerup',()=>{DS.hold=false});
document.addEventListener('pointercancel',()=>{DS.hold=false});
document.addEventListener('keydown',e=>{if(UI.screen==='descent'&&(e.code==='Space'||e.code==='ArrowDown')){e.preventDefault();DS.hold=true}});
document.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowDown')DS.hold=false});
document.addEventListener('click',e=>{
  if(UI.screen!=='descent')return;
  const b=e.target.closest('[data-ds]');if(b){dsResolve(b.dataset.ds);return}
  if(e.target.closest('#dsCarry')){DS.carry=!DS.carry;G.flags.carry=DS.carry?1:0;dsCarryBtn();SND.pick()}
});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#dsPad'))e.preventDefault()});
/* 어둠 속 손전등: 화면을 끌면 비추는 곳이 바뀐다 */
document.addEventListener('pointermove',e=>{const sc=e.target.closest('#dsScene,.scene');if(!sc)return;const d=sc.querySelector('.ds-dark,.torch');if(!d||d.hidden)return;
  const r=sc.getBoundingClientRect();d.style.setProperty('--x',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');d.style.setProperty('--y',((e.clientY-r.top)/r.height*100).toFixed(1)+'%')});

/* ===================== 10 · 감각 연출: 음성 방송 · 환경음 · 이명 · 손전등 ===================== */
/* 음성 방송: 기기의 한국어 음성(TTS). 소리를 꺼도 자막은 나온다. 모두 게임 속 가상 방송. */
function koVoice(){try{const vs=speechSynthesis.getVoices();return vs.find(v=>/^ko/i.test(v.lang)&&/natural|neural|google|premium|enhanced/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null}catch(e){return null}}
try{if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
function broadcast(label,text,opt){
  opt=opt||{};const b=$('#bcast');
  if(b){b.innerHTML=`${ic('sound')}<div><b>${label}</b><span>${text}</span></div>`;b.hidden=false;clearTimeout(broadcast._t);
    broadcast._t=setTimeout(()=>{b.hidden=true},Math.max(4500,text.length*170))}
  if(!SND.on||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(opt.say||text);u.lang='ko-KR';const v=koVoice();if(v)u.voice=v;
    u.rate=opt.rate||.92;u.pitch=opt.pitch||.9;u.volume=1;AMB.level(.35);u.onend=()=>AMB.level(1);speechSynthesis.speak(u)}catch(e){}
}
function hush(){try{speechSynthesis.cancel()}catch(e){}const b=$('#bcast');if(b)b.hidden=true}

/* 환경음: 웅성거림(필터 노이즈) · 형광등 험(120Hz) · 먼 폭음 */
const AMB={n:null,kind:null,iv:0,
  start(kind){if(this.kind===kind&&this.n)return;this.stop();if(!SND.on)return;const c=SND.ac();if(!c)return;this.kind=kind;
    const src=c.createBufferSource();src.buffer=SND.noise();src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=kind==='stair'?380:520;bp.Q.value=.8;
    const g=c.createGain();g.gain.value=0;const lfo=c.createOscillator();lfo.frequency.value=.17;const lg=c.createGain();
    const base=kind==='shelter'?.026:kind==='stair'?.02:.006;lg.gain.value=base*.45;lfo.connect(lg);lg.connect(g.gain);
    src.connect(bp);bp.connect(g);g.connect(c.destination);g.gain.setTargetAtTime(base,c.currentTime,1.2);src.start();lfo.start();
    let hum=null;if(kind==='shelter'&&!G.flags.blackout&&!['high','home'].includes(G.loc)){hum=c.createOscillator();hum.frequency.value=120;const hg=c.createGain();hg.gain.value=.0035;hum.connect(hg);hg.connect(c.destination);hum.start()}
    this.n={src,lfo,g,hum,base};
    this.iv=setInterval(()=>{if(!this.n||!SND.on)return;
      const far=(G&&G.phase==='shelter'&&((G.scen==='conv'&&G.turn<9)||(G.scen==='chem'&&G.turn<2)))||(G&&G.phase==='move'&&G.scen!=='nuke');
      if(far&&Math.random()<.45){SND.boom(false,.22);vib(30)}},16000)},
  level(x){if(!this.n||!SND.ctx)return;this.n.g.gain.setTargetAtTime(this.n.base*x,SND.ctx.currentTime,.35)},
  stop(){clearInterval(this.iv);if(this.n){try{this.n.src.stop();this.n.lfo.stop();if(this.n.hum)this.n.hum.stop()}catch(e){}}this.n=null;this.kind=null}
};
SND.heart=function(){this.tone(58,.12,'sine',.22);this.tone(52,.14,'sine',.16,.16)};
/* 섬광 뒤: 귀울림 + 시야 번짐 */
function stun(){SND.tone(4200,7,'sine',.035);AMB.level(.15);setTimeout(()=>AMB.level(1),5000);
  const a=$('#app');a.classList.remove('stun');void a.offsetWidth;a.classList.add('stun');setTimeout(()=>a.classList.remove('stun'),4800)}

/* 화면별 연출 연결 (render 뒤 호출) */
function senseAfterRender(){
  const s=UI.screen;
  if(s==='shelter')AMB.start('shelter');else if(s==='descent'||s==='move')AMB.start('stair');else if(s==='grab'||s==='alert')AMB.start('home');else AMB.stop();
  if(s==='title'||s==='end'||s==='setup'||s==='records'||s==='family')hush();
  /* 대피소 정전: 손전등 시야 */
  const sc=$('.scene');
  if(s==='shelter'&&sc&&G&&G.flags.blackout&&!['gym'].includes(G.loc)){
    const src=G.flags.light==='torch'||has('torch')?'torch':G.flags.light==='phone'?'phone':G.flags.light==='candle'?'candle':null;
    const r=src==='torch'?'44%':src==='candle'?'34%':src==='phone'?'28%':'11%';
    const d=document.createElement('div');d.className='torch'+(src?'':' none');d.style.setProperty('--r',r);d.style.setProperty('--x','50%');d.style.setProperty('--y','80%');sc.appendChild(d);
    if(!sc.querySelector('.tag2')){const t=document.createElement('span');t.className='tag tag2';t.textContent=src?'정전 · 화면을 끌어 비추기':'정전 · 불빛 없음';sc.appendChild(t)}
  }
  if(s==='shelter'&&sc&&G&&G.cur&&['co_car','burner'].includes(G.cur.ev)){const h=document.createElement('div');h.className='haze';sc.appendChild(h)}
}

/* ===================== 08 · 시작 · 설치판(PWA) ===================== */
(function boot(){
  const start=data=>{
    try{if(data&&data.G&&data.G.v===1&&data.G.phase!=='end'){store.set('sg.save',data.G)}}catch(e){}
    render();
  };
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({G:G&&G.phase!=='end'?Object.assign({},G,{rngS:RNG.s}):null}))}catch(e){}
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
/* 화면 꺼짐 방지(가능한 경우만) — 실시간 단계에서 */
let WL=null;
async function wake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}else if(!on&&WL){await WL.release();WL=null}}catch(e){WL=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&UI.screen==='grab'&&GR.running)wake(true)});
/* 설치판: 생존 수첩(/Survival/) 아래 /game/ 경로에서만 서비스워커 등록 */
(function pwa(){
  if(!('serviceWorker' in navigator)||!window.isSecureContext)return;
  if(!/\/game\/(index\.html)?$/.test(location.pathname))return;
  try{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){})}catch(e){}
  /* 방어: 구버전 생존 수첩 서비스워커가 이 페이지를 자기 index.html 캐시에 덮어쓴 경우 복구 */
  (async function repair(){try{
    if(!('caches' in window))return;const root=new URL('../',location.href);const MARK='data-app="saengjon-72h"';
    const keys=await caches.keys();
    for(const k of keys){if(!/^saengjon-v/.test(k))continue;const c=await caches.open(k);
      for(const p of ['index.html','']){const u=new URL(p,root).href;const hit=await c.match(u);if(!hit)continue;
        const t=await hit.clone().text();if(t.indexOf(MARK)===-1)continue;
        const fresh=await fetch(new URL('index.html',root).href,{cache:'no-store'});
        if(fresh.ok){const ft=await fresh.clone().text();if(ft.indexOf(MARK)===-1)await c.put(u,fresh)}}}
    const reg=await navigator.serviceWorker.getRegistration(root.href);if(reg&&reg.scope===root.href)reg.update();
  }catch(e){}})();
})();

</script>
